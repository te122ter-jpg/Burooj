var PER=2,K="burooj-i",i=0,sr=null,rc=null,ch=[],blob=null,stream=null,HOOK="https://abw1212.app.n8n.cloud/webhook/burooj-9f3k2x7q4m";

function stopRec(){try{if(rc&&rc.state!=="inactive"){rc.stop()}}catch(e){}}
function startRec(){
  blob=null;ch=[];
